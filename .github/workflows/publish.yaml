name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          fetch-tags: true
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate configuration schemas
        run: pnpm validate:schemas
      - run: pnpm build
      - run: pnpm test:git
      - run: pnpm test

      - name: Get bot user id
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Setup GH user
        run: git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
      - name: Setup GH email
        run:
          git config user.email '${{ steps.bot-user.outputs.id }}+${{
          steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Update changelog dates
        run: pnpm run changelog
      - name: Commit changelog date updates
        run: |
          NON_MD=$(git status --short | awk '{print $2}' | grep -v '^\.md$' | grep -v '\.md$' || true)
          if [ -n "$NON_MD" ]; then
            echo "ERROR: unexpected non-.md changes after changelog update:"
            echo "$NON_MD"
            exit 1
          fi
          CHANGED=$(git status --short)
          if [ -n "$CHANGED" ]; then
            git add -A
            git commit -m "automation: update changelog dates [skip ci]"
            
            # We push at the end of the job, if publish succeeds
          else
            echo "No changelog date changes to commit"
          fi

      - run:
          pnpm publish -r --report-summary --publish-branch main --access=public

      - run: pnpm changeset tag

      # Only push git changes once the publish has succeeded
      - name: Push changelog commit and tags
        run: |
          git push
          git push --tags

      - run: pnpm slack:notify
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

      # deprecate any outstanding @next builds, if any
      # - run: pnpm next:deprecate
