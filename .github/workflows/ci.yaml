name: CI

# Runs when a pull request is created or its head is updated
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
on: pull_request

jobs:
  build:
    name: 'Build and Test'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.20.0, 24.18.1, 26.5.1]

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Validate configuration schemas
        run: pnpm validate:schemas
      - name: Build
        run: pnpm run build
      - name: Git Status
        run: pnpm run test:git
      - name: Unit Tests
        run: pnpm run test

  next:
    name: 'Publish @next'
    runs-on: ubuntu-latest

    needs: build

    # if: github.event.pull_request.draft == false
    if: false

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: git config
        run: git config user.name $GIT_USER
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
      - run: git config user.email $GIT_EMAIL
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}

      # - name: Do pre-release
      #   run: pnpm prerelease
